<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sivua ei löytynyt – GlossTahko</title>
    <meta name="robots" content="noindex" />
    <!-- Tämä sivu näytetään missä tahansa puuttuvassa polussa, joten tyylit ovat sisällä
         (suhteelliset polut eivät toimisi) ja linkit korjataan alla olevalla skriptillä. -->
    <style>
      :root {
        --brand: #b86b53;
        --brand-dark: #8f4733;
        --ink-deep: #120f0d;
        --bg: #f6efe4;
        --surface: #fbf5ec;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--brand);
        color: var(--ink-deep);
        font-family: 'Lora', Georgia, 'Times New Roman', serif;
        text-align: center;
        line-height: 1.7;
      }
      main { max-width: 30rem; }
      .logo { display: inline-flex; flex-direction: column; line-height: 1; margin-bottom: 2rem; }
      .logo__main {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600; font-size: 2rem; letter-spacing: 0.3em; text-transform: uppercase;
        margin-right: -0.3em;
      }
      .logo__sub {
        margin-top: 0.4rem; font-family: 'Jost', system-ui, sans-serif;
        font-size: 0.8rem; letter-spacing: 0.5em; text-transform: uppercase; margin-right: -0.5em;
      }
      h1 {
        margin: 0 0 1rem;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      p { margin: 0 auto 1.75rem; }
      a.btn {
        display: inline-flex; align-items: center; min-height: 2.75rem;
        padding: 0.5rem 1.5rem; margin: 0.25rem; border-radius: 999px;
        background: var(--surface); color: var(--ink-deep); text-decoration: none;
        font-size: 0.8rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
      }
      a.btn--ghost { background: transparent; border: 1px solid var(--ink-deep); }
      a.btn:hover { background: var(--bg); }
      a.btn--ghost:hover { background: var(--ink-deep); color: var(--surface); }
      a:focus-visible { outline: 3px solid var(--ink-deep); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <span class="logo__main">Gloss</span>
        <span class="logo__sub">Tahko</span>
      </div>
      <h1>Sivua ei löytynyt</h1>
      <p>
        Hakemaasi sivua ei ole olemassa tai osoite on vaihtunut. Palaa
        etusivulle tai selaa palveluita.
      </p>
      <p>
        <a class="btn" data-path="" href="/">Etusivu</a>
        <a class="btn btn--ghost" data-path="#palvelut" href="/#palvelut">Palvelut</a>
        <a class="btn btn--ghost" data-path="#yhteys" href="/#yhteys">Yhteys</a>
      </p>
    </main>
    <script>
      // GitHub Pages -projektisivu (kayttaja.github.io/repo/) tarvitsee /repo/ -etuliitteen,
      // oma domain ei. Linkit korjataan sen mukaan, ilman että polkua kovakoodataan.
      ;(function () {
        var seg = location.pathname.split('/')[1]
        var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/'
        document.querySelectorAll('a[data-path]').forEach(function (a) {
          a.setAttribute('href', base + a.getAttribute('data-path'))
        })
      })()
    </script>
  </body>
</html>
