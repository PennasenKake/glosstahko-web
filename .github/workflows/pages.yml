# Julkaisee sivun GitHub Pagesiin aina, kun main-haaraan työnnetään muutos.
# Käyttöönotto kerran: GitHub > Settings > Pages > Source: "GitHub Actions".
name: Julkaisu GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch: # sallii ajon käsin Actions-välilehdeltä

permissions:
  contents: read
  pages: write
  id-token: write

# Uusi ajo korvaa keskeneräisen
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Testiosoite on alikansiossa, joten polut tarvitsevat etuliitteen
          VITE_BASE: /glosstahko-web/
          VITE_SITE_URL: https://pennasenkake.github.io/glosstahko-web
          # Demo ei saa kilpailla glosstahko.fi:n kanssa Google-haussa
          VITE_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
